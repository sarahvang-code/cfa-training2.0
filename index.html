<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CFA Training Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#FAFAFA] font-sans antialiased pb-24">

    <!-- Top Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-10">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer" onclick="switchView('dashboard')">
                <div class="w-8 h-8 bg-red-600 rounded-full flex items-center justify-center text-white font-bold text-xl">C</div>
                <span class="font-bold text-gray-800 tracking-tight">CFA TRAINING</span>
            </div>
            <button onclick="switchView('dashboard')" class="text-gray-500 hover:text-gray-900 font-medium text-sm flex items-center gap-1">
                🏠 Home
            </button>
        </div>
    </header>

    <!-- Main Dynamic Content Container -->
    <main id="app-container" class="max-w-4xl mx-auto p-6">
        <!-- Rendered dynamically via JavaScript -->
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 w-full bg-white border-t border-gray-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-20">
        <div class="max-w-md mx-auto flex justify-between px-6 py-3">
            <button onclick="switchView('dashboard')" class="flex flex-col items-center gap-1 text-red-700">
                <span class="text-xl">📚</span>
                <span class="text-xs font-semibold">Training</span>
            </button>
            <button onclick="alert('My Progress view coming up!')" class="flex flex-col items-center gap-1 text-gray-400 hover:text-gray-600">
                <span class="text-xl">📊</span>
                <span class="text-xs font-medium">My Progress</span>
            </button>
            <button onclick="alert('Trainer View coming up!')" class="flex flex-col items-center gap-1 text-gray-400 hover:text-gray-600">
                <span class="text-xl">👥</span>
                <span class="text-xs font-medium">Trainer View</span>
            </button>
        </div>
    </nav>

    <!-- Application Logic -->
    <script>
        // Supabase Configuration
       // Supabase Configuration
        const supabaseUrl = 'https://dpyqsvqorfmuiztvixap.supabase.co';
        const supabaseKey = 'sb_publishable_eLux-50Xnfj1yyT221kX1g_0ySLpo_u';
        const db = supabase.createClient(supabaseUrl, supabaseKey);

        let currentView = 'dashboard';
        let isEditing = true;

        const menuItems = [
            { title: "Welcome & Restaurant Tour", isRed: true },
            { title: "Winning Hearts Everyday" },
            { title: "FOH Food Safety", action: "renderChecklist" },
            { title: "Bagger Training" },
            { title: "FOH Basic Training" },
            { title: "FSA Assessments" },
            { title: "Closing" },
            { title: "My Progress" },
            { title: "Add Team Member" },
            { title: "All Progress" },
            { title: "Edit Training" }
        ];

        const checklistItems = [
            { id: 1, title: "Food Safety Pathway has been completed", hasLink: true, linkText: "Open Link" },
            { id: 2, title: "Demonstrates proper handwashing", description: "Demonstrate handwashing according to Pathway at register and whenever other tasks must be washed.", hasLink: false },
            { id: 3, title: "All required components of uniform are present and in good condition", description: "This includes name tag, dark jeans, non-slip shoes, appropriate CFA shirt, and applicable jacket and hat.", hasLink: false },
            { id: 4, title: "Explains the Food Safety Five principles", description: "Cross Contamination, Time/Temperature, strict Health and Hygiene guidelines, Cleaning and Sanitation, and Pest Elimination.", hasLink: true, linkText: "Open Link" }
        ];

        function switchView(view) {
            currentView = view;
            render();
        }

        async function handleCheckboxChange(taskName, isChecked) {
            try {
                const { data, error } = await db
                    .from('training_progress')
                    .insert([{ employee_name: 'Test Employee', department: 'FOH', task_name: taskName, is_completed: isChecked }]);
                
                if (error) console.error('Error saving to Supabase:', error);
                else console.log('Saved successfully:', data);
            } catch (err) {
                console.error('Network error:', err);
            }
        }

        function render() {
            const container = document.getElementById('app-container');
            
            if (currentView === 'dashboard') {
                container.innerHTML = `
                    <div class="mb-8">
                        <h1 class="text-3xl font-bold text-gray-900">FOH Training</h1>
                        <p class="text-gray-500 mt-2">Training reference and shared progress tracker.</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${menuItems.map(item => `
                            <button onclick="${item.action ? `switchView('${item.action}')` : `alert('${item.title} clicked')`}" 
                                class="flex items-center justify-between p-4 rounded-xl shadow-sm border transition-all text-left ${item.isRed ? 'bg-red-700 text-white border-red-700 hover:bg-red-800' : 'bg-white text-gray-800 border-gray-100 hover:border-red-200 hover:shadow-md'}">
                                <span class="font-medium text-lg">${item.title}</span>
                                <span class="${item.isRed ? 'text-white' : 'text-gray-400'} font-bold">›</span>
                            </button>
                        `).join('')}
                    </div>
                `;
            } else if (currentView === 'renderChecklist') {
                container.innerHTML = `
                    <div class="mb-6 flex items-center gap-2 text-sm text-gray-500">
                        <button onclick="switchView('dashboard')" class="hover:text-red-700">FOH Training</button>
                        <span>/</span>
                        <span class="text-gray-900">Food Safety Basics</span>
                    </div>

                    <div class="flex justify-between items-center mb-6">
                        <h1 class="text-3xl font-bold text-gray-900">FOH Food Safety</h1>
                        <button onclick="isEditing = !isEditing; render();" class="bg-gray-100 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-200">
                            ${isEditing ? 'Exit Editing' : 'Edit Training'}
                        </button>
                    </div>

                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                        <div class="p-6 bg-gray-50/50 border-b border-gray-200">
                            <h2 class="text-xl font-semibold text-gray-800">Food Safety Basics</h2>
                        </div>
                        <div class="divide-y divide-gray-100">
                            ${checklistItems.map(item => `
                                <div class="p-6 flex gap-4 hover:bg-gray-50/50 transition-colors">
                                    <input type="checkbox" onchange="handleCheckboxChange('${item.title}', this.checked)" class="mt-1.5 w-5 h-5 rounded border-gray-300 text-red-600 focus:ring-red-500 cursor-pointer">
                                    <div class="flex-1">
                                        <h3 class="text-lg font-medium text-gray-900">${item.title}</h3>${item.description ? `<p class="text-gray-500 mt-1 text-sm leading-relaxed">${item.description}</p>` : ''}
                                        <div class="mt-4 flex flex-wrap gap-3">
                                            ${item.hasLink ? `<button onclick="window.open('https://www.youtube.com', '_blank')" class="flex items-center gap-2 px-4 py-1.5 rounded text-sm font-medium text-red-700 bg-red-50 hover:bg-red-100 border border-red-100">🔗 ${item.linkText}</button>` : ''}
                                            ${isEditing ? `
                                                <button class="px-3 py-1.5 text-sm font-medium text-gray-600 hover:bg-gray-100 rounded">✏️ Edit</button>
                                                <button class="px-3 py-1.5 text-sm font-medium text-gray-600 hover:text-red-600 hover:bg-red-50 rounded">🗑️ Delete</button>
                                            ` : ''}
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        ${isEditing ? `<div class="p-4 border-t border-gray-100 bg-gray-50"><button class="text-red-600 font-medium text-sm hover:text-red-700">+ Add Item</button></div>` : ''}
                    </div>
                `;
            }
        }

        // Initial render on load
        render();
    </script>
</body>
</html>
